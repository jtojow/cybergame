<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CTF Hacker Game</title>
    <style>
        /* General page styling */
        body {
            background-color: #0c0c0c;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* THE HUB SCREEN STYLES */
        #hub-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            padding-top: 50px;
            height: 100%;
            text-align: center;
            overflow-y: auto; 
        }
        
        .hub-title {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff00;
        }

        .theme-section {
            border: 1px solid #00ff00;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            width: 80%;
            max-width: 600px;
            background-color: #111;
        }

        .theme-title {
            font-size: 1.5em;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px dashed #00ff00;
            padding-bottom: 10px;
        }

        .level-btn {
            background-color: #00ff00;
            color: #0c0c0c;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            font-size: 1.1em;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            width: 100%; 
        }

        .level-btn:hover {
            background-color: #00cc00;
            box-shadow: 0 0 10px #00ff00;
        }

        /* THE TERMINAL SCREEN STYLES */
        #terminal-screen {
            display: none; /* Hidden when the game loads */
            flex-direction: column;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        #terminal-output {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            white-space: pre-wrap;
            font-size: 16px;
        }

        .input-line { display: flex; font-size: 16px; }
        .prompt { margin-right: 10px; color: #00ff00; }
        
        input[type="text"] {
            background-color: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            flex-grow: 1;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- THE HUB SCREEN HTML -->
    <div id="hub-screen">
        <div class="hub-title">CTF TRAINING HUB</div>

        <!-- THEME 1 -->
        <div class="theme-section">
            <h2 class="theme-title">Theme 1: Terminal & Network Recon</h2>
            <button class="level-btn" onclick="startLevel(1)">Level 1: The SSH Backdoor</button>
            <button class="level-btn" onclick="startLevel(2)">Level 2: Log Analysis (Coming Soon)</button>
        </div>

        <!-- THEME 2 -->
        <div class="theme-section">
            <h2 class="theme-title">Theme 2: Web App Penetration</h2>
            <button class="level-btn" onclick="startLevel(3)">Level 1: Burp Suite Simulator (Coming Soon)</button>
        </div>
    </div>

    <!-- THE TERMINAL SCREEN HTML -->
    <div id="terminal-screen">
        <div id="terminal-output"></div>
        <div class="input-line">
            <span class="prompt" id="prompt-text">player@kali:~#</span>
            <input type="text" id="command-input" autocomplete="off">
        </div>
    </div>

    <!-- THE JAVASCRIPT LOGIC -->
    <script>
        const hubScreen = document.getElementById('hub-screen');
        const terminalScreen = document.getElementById('terminal-screen');
        const outputDiv = document.getElementById('terminal-output');
        const inputField = document.getElementById('command-input');
        const promptText = document.getElementById('prompt-text');
        
        let isRoot = false; 
        let currentLevel = 0; 
        let commandHistory = [];
        let historyIndex = -1;

        // --- HUB CONTROL LOGIC ---
        
        function startLevel(levelNumber) {
            currentLevel = levelNumber; 
            
            hubScreen.style.display = 'none';
            terminalScreen.style.display = 'flex';
            
            outputDiv.innerHTML = '';
            isRoot = false;
            commandHistory = [];
            historyIndex = -1;
            updatePrompt();
            
            printOutput(`Initializing Exercise ${currentLevel}...`);
            printOutput(`Type 'help' to see your tools. Type 'exit' to return to the Hub.\n`);
            
            // Forces the browser to focus on the typing area so the player can just start typing
            setTimeout(() => inputField.focus(), 10);
        }

        function exitToHub() {
            terminalScreen.style.display = 'none';
            hubScreen.style.display = 'flex';
        }

        function updatePrompt() {
            promptText.textContent = isRoot ? "root@target:~#" : "player@kali:~#";
        }

        // --- TERMINAL LOGIC ---

        inputField.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const command = inputField.value.trim();
                if (command !== '') { commandHistory.push(command); }
                historyIndex = commandHistory.length;
                
                printOutput((isRoot ? "root@target:~# " : "player@kali:~# ") + command);
                processCommand(command);
                
                inputField.value = '';
                outputDiv.scrollTop = outputDiv.scrollHeight; 

            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    inputField.value = commandHistory[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    inputField.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    inputField.value = ''; 
                }
            }
        });

        function printOutput(text) {
            const newLine = document.createElement('div');
            newLine.textContent = text;
            outputDiv.appendChild(newLine);
        }

        function processCommand(cmd) {
            const args = cmd.split(' ');
            const baseCommand = args[0].toLowerCase();

            switch(baseCommand) {
                case 'help':
                    printOutput("Available commands: help, clear, ls, cat, nmap, ssh, whoami, pwd, grep, exit");
                    break;
                case 'clear':
                    outputDiv.innerHTML = ''; 
                    break;
                case 'exit':
                    exitToHub(); 
                    break;
                case 'whoami':
                    printOutput(isRoot ? "root" : "player");
                    break;
                case 'pwd':
                    printOutput(isRoot ? "/root" : "/home/player");
                    break;
                
                case 'ls':
                    if (currentLevel === 1) {
                        printOutput("target_ips.txt   mission_brief.md   flag.txt");
                    } else {
                        printOutput("Directory is empty or unavailable.");
                    }
                    break;

                case 'cat':
                    if (currentLevel === 1) {
                        if (args[1] === "flag.txt") {
                            if (isRoot) {
                                printOutput("CTF{y0u_h4ck3d_th3_m41nfr4m3}");
                                printOutput("CONGRATULATIONS! You beat Exercise 1!");
                            } else {
                                printOutput("Permission denied. You must escalate privileges.");
                            }
                        } else if (args[1] === "target_ips.txt") {
                            printOutput("192.168.1.100\n192.168.1.101");
                        } else if (args[1] === "mission_brief.md") {
                            printOutput("MISSION: Infiltrate the target server.\nINTEL: The admins often use the default password 'admin123' for SSH.");
                        } else {
                            printOutput("cat: missing or invalid file name.");
                        }
                    } else {
                        printOutput("cat: missing or invalid file name.");
                    }
                    break;

                case 'nmap':
                    if (currentLevel === 1 && args[1] === "192.168.1.100") {
                        printOutput(`Starting Nmap scan on ${args[1]}...`);
                        setTimeout(() => {
                            printOutput(`PORT   STATE SERVICE\n22/tcp open  ssh\n80/tcp open  http`);
                            outputDiv.scrollTop = outputDiv.scrollHeight; 
                        }, 1500);
                    } else {
                        printOutput("Usage: nmap [target_ip]");
                    }
                    break;

                case 'ssh':
                    if (currentLevel === 1 && args[1] === "root@192.168.1.100" && args[2] === "admin123") {
                        isRoot = true; 
                        updatePrompt();
                        printOutput("Authentication successful. Welcome, root.");
                    } else {
                        printOutput("Usage: ssh [user]@[ip] [password]");
                    }
                    break;

                case 'grep':
                    if (currentLevel === 1 && args[2] === "mission_brief.md") {
                        const fileContent = "MISSION: Infiltrate the target server.\nINTEL: The admins often use the default password 'admin123' for SSH.";
                        const match = fileContent.split('\n').find(line => line.toLowerCase().includes(args[1].toLowerCase()));
                        if (match) {
                            printOutput(match); 
                        }
                    } else {
                        printOutput("grep: Invalid usage or file.");
                    }
                    break;

                case '':
                    break; 
                default:
                    printOutput(`bash: ${baseCommand}: command not found`);
            }
        }
    </script>
</body>
</html>
