<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CTF Terminal Simulator</title>
    <!-- CSS for the hacker terminal aesthetic -->
    <style>
        body {
            background-color: #0c0c0c;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        #terminal-output {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            white-space: pre-wrap;
            font-size: 16px;
        }
        .input-line {
            display: flex;
            font-size: 16px;
        }
        .prompt {
            margin-right: 10px;
            color: #00ff00;
        }
        /* Makes the input field blend into the terminal background */
        input[type="text"] {
            background-color: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            flex-grow: 1;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- HTML: The visual structure of the terminal -->
    <div id="terminal-output">Welcome to CTF-OS v1.0.0
System initialized. Type 'help' to see available commands.
</div>
    <div class="input-line">
        <span class="prompt">root@player:~#</span>
        <input type="text" id="command-input" autocomplete="off" autofocus>
    </div>

    <!-- JavaScript: The engine that processes the commands -->
    <script>
        const outputDiv = document.getElementById('terminal-output');
        const inputField = document.getElementById('command-input');

        // 1. Listen for the Enter key to be pressed
        inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const command = inputField.value.trim();
                
                // Echo the command to the screen like a real terminal
                printOutput(`root@player:~# ${command}`);
                
                // Run the game logic
                processCommand(command);
                
                // Clear the input and scroll to the bottom
                inputField.value = '';
                outputDiv.scrollTop = outputDiv.scrollHeight; 
            }
        });

        // 2. Helper function to print text to our terminal window
        function printOutput(text) {
            const newLine = document.createElement('div');
            newLine.textContent = text;
            outputDiv.appendChild(newLine);
        }

        // 3. Game Logic: Process the simulated Linux commands
        function processCommand(cmd) {
            // Split the input into an array (e.g., "nmap 10.0.0.5" becomes ["nmap", "10.0.0.5"])
            const args = cmd.split(' ');
            const baseCommand = args[0].toLowerCase();

            switch(baseCommand) {
                case 'help':
                    printOutput("Available commands: help, clear, ls, cat, nmap");
                    break;
                case 'clear':
                    outputDiv.innerHTML = ''; // Wipes the screen
                    break;
                case 'ls':
                    printOutput("target_ips.txt   mission_brief.md   flag.txt");
                    break;
                case 'cat':
                    if (args[1] === "flag.txt") {
                        printOutput("Permission denied. You must escalate privileges.");
                    } else if (args[1] === "target_ips.txt") {
                        printOutput("192.168.1.100\n192.168.1.101");
                    } else {
                        printOutput("cat: missing or invalid file name.");
                    }
                    break;
                case 'nmap':
                    // Check if they provided an IP address to scan
                    if (args[1] === "192.168.1.100") {
                        printOutput(`Starting Nmap scan on ${args[1]}...`);
                        // setTimeout creates a slight delay to simulate a real scan taking time
                        setTimeout(() => {
                            printOutput(`PORT   STATE SERVICE\n22/tcp open  ssh\n80/tcp open  http`);
                            outputDiv.scrollTop = outputDiv.scrollHeight; // Auto-scroll again after delay
                        }, 1500);
                    } else if (args[1]) {
                        printOutput(`Starting Nmap scan on ${args[1]}...\nHost seems down. If it is really up, but blocking our ping probes, try -Pn`);
                    } else {
                        printOutput("Usage: nmap [target_ip]");
                    }
                    break;
                case '':
                    break; // Do nothing if they just press Enter on a blank line
                default:
                    printOutput(`bash: ${baseCommand}: command not found`);
            }
        }
    </script>
</body>
</html>
