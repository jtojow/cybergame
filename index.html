<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CTF Hacker Game</title>
    <style>
        /* General page styling */
        body {
            background-color: #0c0c0c;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 1. THE HUB SCREEN STYLES */
        #hub-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            padding-top: 50px;
            height: 100%;
            text-align: center;
            overflow-y: auto; 
        }
        
        .hub-title { font-size: 3em; margin-bottom: 20px; text-shadow: 0 0 10px #00ff00; }
        .theme-section { border: 1px solid #00ff00; border-radius: 8px; padding: 20px; margin-bottom: 30px; width: 80%; max-width: 600px; background-color: #111; }
        .theme-title { font-size: 1.5em; margin-top: 0; margin-bottom: 15px; border-bottom: 1px dashed #00ff00; padding-bottom: 10px; }
        .level-btn { background-color: #00ff00; color: #0c0c0c; border: none; padding: 10px 20px; margin: 5px; font-size: 1.1em; font-family: 'Courier New', Courier, monospace; font-weight: bold; cursor: pointer; border-radius: 3px; width: 100%; }
        .level-btn:hover { background-color: #00cc00; box-shadow: 0 0 10px #00ff00; }

        /* 2. THE TERMINAL SCREEN STYLES */
        #terminal-screen {
            display: none; 
            flex-direction: column;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }
        #terminal-output { flex-grow: 1; overflow-y: auto; margin-bottom: 10px; white-space: pre-wrap; font-size: 16px; }
        .input-line { display: flex; font-size: 16px; }
        .prompt { margin-right: 10px; color: #00ff00; }
        input[type="text"] { background-color: transparent; border: none; color: #00ff00; font-family: 'Courier New', Courier, monospace; font-size: 16px; flex-grow: 1; outline: none; }

        /* 3. NEW: THE BURP SUITE SCREEN STYLES */
        #burp-screen {
            display: none; /* Hidden by default */
            flex-direction: row; /* Split screen layout */
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            gap: 20px;
        }

        .panel {
            flex: 1;
            border: 2px solid #00ff00;
            border-radius: 5px;
            padding: 20px;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
        }

        .panel-title { font-size: 1.5em; text-align: center; margin-bottom: 20px; border-bottom: 1px solid #00ff00; padding-bottom: 10px;}
        
        /* Fake Website Styles */
        .fake-form { display: flex; flex-direction: column; gap: 15px; max-width: 300px; margin: 0 auto; }
        .fake-form input { padding: 10px; font-family: inherit; }
        .fake-form button { padding: 10px; background-color: #00ff00; font-weight: bold; cursor: pointer; border: none; }
        
        /* Interceptor Styles */
        #interceptor-textarea {
            flex-grow: 1;
            background-color: #000;
            color: #ffa500; /* Orange text to stand out like a proxy tool */
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            padding: 10px;
            border: 1px solid #555;
            resize: none;
            margin-bottom: 15px;
            outline: none;
        }
        
        #interceptor-controls { display: flex; gap: 10px; justify-content: center; }
        .proxy-btn { padding: 10px 20px; font-weight: bold; cursor: pointer; background-color: #ffa500; border: none; }
        
        .exit-btn { position: absolute; top: 10px; right: 20px; background: red; color: white; border: none; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 1. THE HUB SCREEN HTML -->
    <div id="hub-screen">
        <div class="hub-title">CTF TRAINING HUB</div>
        <div class="theme-section">
            <h2 class="theme-title">Theme 1: Terminal & Network Recon</h2>
            <button class="level-btn" onclick="startLevel(1)">Level 1: The SSH Backdoor</button>
            <button class="level-btn" onclick="startLevel(2)">Level 2: Log Analysis</button>
        </div>
        <div class="theme-section">
            <h2 class="theme-title">Theme 2: Web App Penetration</h2>
            <!-- Changed this button to load Level 3 -->
            <button class="level-btn" onclick="startLevel(3)">Level 1: Parameter Tampering</button> 
        </div>
    </div>

    <!-- 2. THE TERMINAL SCREEN HTML -->
    <div id="terminal-screen">
        <div id="terminal-output"></div>
        <div class="input-line">
            <span class="prompt" id="prompt-text">player@kali:~#</span>
            <input type="text" id="command-input" autocomplete="off">
        </div>
    </div>

    <!-- 3. NEW: THE BURP SUITE SCREEN HTML -->
    <div id="burp-screen">
        <button class="exit-btn" onclick="exitToHub()">Exit to Hub</button>
        
        <!-- Left Side: Fake Target Website -->
        <div class="panel" id="target-website">
            <div class="panel-title">Target: Employee Portal</div>
            <div class="fake-form">
                <p>Welcome to the secure employee portal. Please log in.</p>
                <input type="text" id="fake-username" placeholder="Username" value="guest">
                <input type="password" id="fake-password" placeholder="Password" value="guest123">
                <button onclick="triggerIntercept()">Log In</button>
                <div id="website-response" style="margin-top: 20px; color: yellow;"></div>
            </div>
        </div>

        <!-- Right Side: Interceptor Proxy -->
        <div class="panel" id="proxy-panel">
            <div class="panel-title" style="color: #ffa500; border-color: #ffa500;">Proxy Interceptor (Intercept is ON)</div>
            <textarea id="interceptor-textarea" placeholder="Waiting for web request..."></textarea>
            <div id="interceptor-controls">
                <button class="proxy-btn" onclick="forwardRequest()">Forward</button>
                <button class="proxy-btn" onclick="dropRequest()" style="background-color: #555; color: white;">Drop</button>
            </div>
        </div>
    </div>

    <!-- THE JAVASCRIPT LOGIC -->
    <!-- THE JAVASCRIPT LOGIC -->
    <script>
        // --- SCREEN ROUTING VARIABLES ---
        const hubScreen = document.getElementById('hub-screen');
        const terminalScreen = document.getElementById('terminal-screen');
        const burpScreen = document.getElementById('burp-screen'); 
        
        // --- TERMINAL VARIABLES ---
        const outputDiv = document.getElementById('terminal-output');
        const inputField = document.getElementById('command-input');
        const promptText = document.getElementById('prompt-text');
        let isRoot = false; 
        let currentLevel = 0; 
        let commandHistory = [];
        let historyIndex = -1;

        // --- BURP SUITE VARIABLES ---
        const interceptorTextarea = document.getElementById('interceptor-textarea');
        const websiteResponse = document.getElementById('website-response');
        const fakeUsername = document.getElementById('fake-username');

        // --- HUB CONTROL LOGIC ---
        function startLevel(levelNumber) {
            currentLevel = levelNumber; 
            
            hubScreen.style.display = 'none';
            terminalScreen.style.display = 'none';
            burpScreen.style.display = 'none';
            
            if (currentLevel === 1 || currentLevel === 2) {
                terminalScreen.style.display = 'flex';
                outputDiv.innerHTML = '';
                isRoot = false;
                commandHistory = [];
                historyIndex = -1;
                updatePrompt();
                printOutput(`Initializing Exercise ${currentLevel}... Type 'help' to see your tools. Type 'exit' to return to the Hub.\n`);
                setTimeout(() => inputField.focus(), 10);
            } 
            else if (currentLevel === 3) {
                burpScreen.style.display = 'flex';
                interceptorTextarea.value = '';
                websiteResponse.innerText = '';
            }
        }

        function exitToHub() {
            terminalScreen.style.display = 'none';
            burpScreen.style.display = 'none'; 
            hubScreen.style.display = 'flex';
        }

        function updatePrompt() { promptText.textContent = isRoot ? "root@target:~#" : "player@kali:~#"; }

        // --- BURP SUITE LOGIC ---
        function triggerIntercept() {
            const user = fakeUsername.value;
            const fakeHttpRequest = 
`POST /api/login HTTP/1.1
Host: secure-portal.local
Content-Type: application/x-www-form-urlencoded
User-Agent: Mozilla/5.0

username=${user}&password=guest123&role=user`;

            interceptorTextarea.value = fakeHttpRequest;
            websiteResponse.innerText = "Request intercepted! Modifying data in proxy...";
        }

        function forwardRequest() {
            const modifiedRequest = interceptorTextarea.value;
            if (modifiedRequest === '') {
                websiteResponse.innerText = "Error: No request to forward.";
                return;
            }
            if (modifiedRequest.includes('role=admin')) {
                websiteResponse.style.color = "#00ff00";
                websiteResponse.innerText = "SUCCESS! Flag: CTF{param_t4mp3r1ng_m4st3r}\nWelcome, Administrator.";
            } else {
                websiteResponse.style.color = "red";
                websiteResponse.innerText = "Access Denied. You are logged in as a normal user. You need admin rights to see the flag.";
            }
            interceptorTextarea.value = ''; 
        }

        function dropRequest() {
            interceptorTextarea.value = '';
            websiteResponse.style.color = "yellow";
            websiteResponse.innerText = "Request dropped by proxy.";
        }

        // --- TERMINAL LOGIC ---
        inputField.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const command = inputField.value.trim();
                if (command !== '') { commandHistory.push(command); }
                historyIndex = commandHistory.length;
                printOutput((isRoot ? "root@target:~# " : "player@kali:~# ") + command);
                processCommand(command);
                inputField.value = '';
                outputDiv.scrollTop = outputDiv.scrollHeight; 
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) { historyIndex--; inputField.value = commandHistory[historyIndex]; }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) { historyIndex++; inputField.value = commandHistory[historyIndex];
                } else { historyIndex = commandHistory.length; inputField.value = ''; }
            }
        });

        function printOutput(text) {
            const newLine = document.createElement('div');
            newLine.textContent = text;
            outputDiv.appendChild(newLine);
        }

        function processCommand(cmd) {
            const args = cmd.split(' ');
            const baseCommand = args[0].toLowerCase();
            switch(baseCommand) {
                case 'help': printOutput("Available commands: help, clear, ls, cat, nmap, ssh, whoami, pwd, grep, exit"); break;
                case 'clear': outputDiv.innerHTML = ''; break;
                case 'exit': exitToHub(); break;
                case 'whoami': printOutput(isRoot ? "root" : "player"); break;
                case 'pwd': printOutput(isRoot ? "/root" : "/home/player"); break;
                case 'ls':
                    if (currentLevel === 1) printOutput("target_ips.txt   mission_brief.md   flag.txt");
                    else printOutput("Directory is empty or unavailable.");
                    break;
                case 'cat':
                    if (currentLevel === 1) {
                        if (args[1] === "flag.txt") {
                            if (isRoot) printOutput("CTF{y0u_h4ck3d_th3_m41nfr4m3}\nCONGRATULATIONS! You beat Exercise 1!");
                            else printOutput("Permission denied. You must escalate privileges.");
                        } else if (args[1] === "target_ips.txt") printOutput("192.168.1.100\n192.168.1.101");
                        else if (args[1] === "mission_brief.md") printOutput("MISSION: Infiltrate the target server.\nINTEL: The admins often use the default password 'admin123' for SSH.");
                        else printOutput("cat: missing or invalid file name.");
                    } else printOutput("cat: missing or invalid file name.");
                    break;
                
                // OUR UPGRADED NMAP CODE
                case 'nmap':
                    if (currentLevel !== 1) {
                        printOutput("nmap: command not found or network unavailable.");
                        break;
                    }
                    const fullCommand = args.join(' ');
                    const targetIP = "192.168.1.100";
                    if (!fullCommand.includes(targetIP)) {
                        printOutput("Usage: nmap [flags] [target_ip]");
                        printOutput("Hint: Did you check your target_ips.txt file?");
                        break;
                    }
                    const usedVersionFlag = fullCommand.includes('-sV');
                    printOutput(`Starting Nmap scan on ${targetIP}...`);
                    setTimeout(() => {
                        if (usedVersionFlag) {
                            printOutput(`PORT   STATE SERVICE VERSION`);
                            printOutput(`22/tcp open  ssh     OpenSSH 8.2p1 Ubuntu 4ubuntu0.5`);
                            printOutput(`80/tcp open  http    Apache httpd 2.4.41`);
                        } else {
                            printOutput(`PORT   STATE SERVICE`);
                            printOutput(`22/tcp open  ssh`);
                            printOutput(`80/tcp open  http`);
                            printOutput(`\nHint: Try using the '-sV' flag to determine the service versions!`);
                        }
                        outputDiv.scrollTop = outputDiv.scrollHeight; 
                    }, 1500);
                    break;

                case 'ssh':
                    if (currentLevel === 1 && args[1] === "root@192.168.1.100" && args[2] === "admin123") {
                        isRoot = true; updatePrompt(); printOutput("Authentication successful. Welcome, root.");
                    } else printOutput("Usage: ssh [user]@[ip] [password]");
                    break;
                case 'grep':
                    if (currentLevel === 1 && args[2] === "mission_brief.md") {
                        const fileContent = "MISSION: Infiltrate the target server.\nINTEL: The admins often use the default password 'admin123' for SSH.";
                        const match = fileContent.split('\n').find(line => line.toLowerCase().includes(args[1].toLowerCase()));
                        if (match) printOutput(match); 
                    } else printOutput("grep: Invalid usage or file.");
                    break;
                case '': break; 
                default: printOutput(`bash: ${baseCommand}: command not found`);
            }
        }
    <script src="game.js"></script>
</body>
</html>
