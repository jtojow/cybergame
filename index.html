<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CTF Terminal Simulator</title>
    <!-- CSS for the hacker terminal aesthetic -->
    <style>
        body {
            background-color: #0c0c0c;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        #terminal-output {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            white-space: pre-wrap;
            font-size: 16px;
        }
        .input-line {
            display: flex;
            font-size: 16px;
        }
        .prompt {
            margin-right: 10px;
            color: #00ff00;
        }
        /* Makes the input field blend into the terminal background */
        input[type="text"] {
            background-color: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            flex-grow: 1;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- HTML: The visual structure of the terminal -->
    <div id="terminal-output">Welcome to CTF-OS v1.0.0
System initialized. Type 'help' to see available commands.
</div>
    <div class="input-line">
        <span class="prompt">root@player:~#</span>
        <input type="text" id="command-input" autocomplete="off" autofocus>
    </div>

    <!-- JavaScript: The engine that processes the commands -->
   <script>
        const outputDiv = document.getElementById('terminal-output');
        const inputField = document.getElementById('command-input');
        
        // Tracks if the player has hacked the server
        let isRoot = false; 

        inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const command = inputField.value.trim();
                
                // Change the prompt dynamically based on if they are root or not
                const promptString = isRoot ? "root@target:~# " : "player@kali:~# ";
                printOutput(promptString + command);
                
                processCommand(command);
                
                inputField.value = '';
                outputDiv.scrollTop = outputDiv.scrollHeight; 
            }
        });

        function printOutput(text) {
            const newLine = document.createElement('div');
            newLine.textContent = text;
            outputDiv.appendChild(newLine);
        }

        function processCommand(cmd) {
            const args = cmd.split(' ');
            const baseCommand = args[0].toLowerCase();

            switch(baseCommand) {
                case 'help':
                    printOutput("Available commands: help, clear, ls, cat, nmap, ssh");
                    break;
                case 'clear':
                    outputDiv.innerHTML = ''; 
                    break;
                case 'ls':
                    printOutput("target_ips.txt   mission_brief.md   flag.txt");
                    break;
                case 'cat':
                    if (args[1] === "flag.txt") {
                        if (isRoot) {
                            printOutput("CTF{y0u_h4ck3d_th3_m41nfr4m3}");
                            printOutput("CONGRATULATIONS! You beat the level!");
                        } else {
                            printOutput("Permission denied. You must escalate privileges.");
                        }
                    } else if (args[1] === "target_ips.txt") {
                        printOutput("192.168.1.100\n192.168.1.101");
                    } else if (args[1] === "mission_brief.md") {
                        printOutput("MISSION: Infiltrate the target server.\nINTEL: The admins often use the default password 'admin123' for SSH.");
                    } else {
                        printOutput("cat: missing or invalid file name.");
                    }
                    break;
                case 'nmap':
                    if (args[1] === "192.168.1.100") {
                        printOutput(`Starting Nmap scan on ${args[1]}...`);
                        setTimeout(() => {
                            printOutput(`PORT   STATE SERVICE\n22/tcp open  ssh\n80/tcp open  http`);
                            outputDiv.scrollTop = outputDiv.scrollHeight; 
                        }, 1500);
                    } else {
                        printOutput("Usage: nmap [target_ip]");
                    }
                    break;
                case 'ssh':
                    if (args[1] === "root@192.168.1.100" && args[2] === "admin123") {
                        isRoot = true; 
                        document.querySelector('.prompt').textContent = "root@target:~#";
                        printOutput("Authentication successful. Welcome, root.");
                    } else {
                        printOutput("Usage: ssh [user]@[ip] [password]\nHint: Check your files for credentials.");
                    }
                    break;
                case '':
                    break; 
                default:
                    printOutput(`bash: ${baseCommand}: command not found`);
            }
        }
    </script>
</body>
</html>
